<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="400" viewBox="0 0 1240 400" font-family="Droid Serif, Georgia, serif">
  <rect x="30" y="100" width="250" height="192" rx="12" fill="#e3edfb" stroke="#a7aeb8" stroke-width="1.5"/>
  <circle cx="155.0" cy="52" r="20" fill="#1a1a1a"/>
  <text x="155.0" y="59" text-anchor="middle" font-family="Droid Serif, Georgia, 'Times New Roman', serif" font-size="22" fill="#ffffff">1</text>
  <text x="155.0" y="152" text-anchor="middle" font-family="Droid Serif, Georgia, 'Times New Roman', serif" font-size="20" font-weight="bold" fill="#1a1a1a">Working Directory</text>
  <text x="155.0" y="192" text-anchor="middle" font-family="Droid Serif, Georgia, serif" font-size="17" fill="#555555">files you edit</text>
  <text x="155.0" y="250" text-anchor="middle" font-family="Inconsolata, 'Ubuntu Mono', Consolas, Menlo, monospace" font-size="16" fill="#2640c0">working tree</text>
  <rect x="340" y="100" width="250" height="192" rx="12" fill="#e7f6ec" stroke="#a7aeb8" stroke-width="1.5"/>
  <circle cx="465.0" cy="52" r="20" fill="#1a1a1a"/>
  <text x="465.0" y="59" text-anchor="middle" font-family="Droid Serif, Georgia, 'Times New Roman', serif" font-size="22" fill="#ffffff">2</text>
  <text x="465.0" y="152" text-anchor="middle" font-family="Droid Serif, Georgia, 'Times New Roman', serif" font-size="23" font-weight="bold" fill="#1a1a1a">Staging Area</text>
  <text x="465.0" y="192" text-anchor="middle" font-family="Droid Serif, Georgia, serif" font-size="17" fill="#555555">files picked for commit</text>
  <text x="465.0" y="250" text-anchor="middle" font-family="Inconsolata, 'Ubuntu Mono', Consolas, Menlo, monospace" font-size="16" fill="#2640c0">index</text>
  <rect x="650" y="100" width="250" height="192" rx="12" fill="#fdf3d7" stroke="#a7aeb8" stroke-width="1.5"/>
  <circle cx="775.0" cy="52" r="20" fill="#1a1a1a"/>
  <text x="775.0" y="59" text-anchor="middle" font-family="Droid Serif, Georgia, 'Times New Roman', serif" font-size="22" fill="#ffffff">3</text>
  <text x="775.0" y="152" text-anchor="middle" font-family="Droid Serif, Georgia, 'Times New Roman', serif" font-size="22" font-weight="bold" fill="#1a1a1a">Local Repository</text>
  <text x="775.0" y="192" text-anchor="middle" font-family="Droid Serif, Georgia, serif" font-size="17" fill="#555555">where history lives</text>
  <text x="775.0" y="250" text-anchor="middle" font-family="Inconsolata, 'Ubuntu Mono', Consolas, Menlo, monospace" font-size="16" fill="#2640c0">.git</text>
  <rect x="960" y="100" width="250" height="192" rx="12" fill="#f2eafc" stroke="#a7aeb8" stroke-width="1.5"/>
  <circle cx="1085.0" cy="52" r="20" fill="#1a1a1a"/>
  <text x="1085.0" y="59" text-anchor="middle" font-family="Droid Serif, Georgia, 'Times New Roman', serif" font-size="22" fill="#ffffff">4</text>
  <text x="1085.0" y="152" text-anchor="middle" font-family="Droid Serif, Georgia, 'Times New Roman', serif" font-size="19" font-weight="bold" fill="#1a1a1a">Remote Repository</text>
  <text x="1085.0" y="192" text-anchor="middle" font-family="Droid Serif, Georgia, serif" font-size="17" fill="#555555">the shared copy</text>
  <text x="1085.0" y="250" text-anchor="middle" font-family="Inconsolata, 'Ubuntu Mono', Consolas, Menlo, monospace" font-size="16" fill="#2640c0">origin</text>
</svg>
